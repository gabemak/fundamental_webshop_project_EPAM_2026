<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Shop - Catalog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/scss/main.scss" />
  </head>
  <body>
    <header>
      <load src="/src/pages/header.html" />
    </header>

    <main class="catalog-page">
      <div class="container">
        <div class="catalog-header">
          <div class="results-count" id="results-info">
            Showing 1-12 of 20 Results
          </div>

          <div class="catalog-actions">
            <div class="sort-wrapper">
              <select id="sort-select">
                <option value="default">Default Sorting</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="popularity">Popularity (Most popular)</option>
                <option value="rating">Rating (Highest first)</option>
              </select>
            </div>

            <div class="search-wrapper">
              <input
                type="text"
                id="catalog-search"
                placeholder="Search Models"
              />
              <button type="button" class="search-btn">
                <img
                  src="/src/assets/catalogImages/magniglass.png"
                  alt="Search"
                />
              </button>
            </div>
          </div>
        </div>

        <div class="catalog-main-content">
          <section class="products-section">
            <div class="product-grid-catalog" id="product-grid"></div>
            <div class="pagination" id="pagination"></div>
          </section>

          <aside class="top-sets-sidebar">
            <h3>Top Best Sets</h3>
            <div id="top-sets-container"></div>
          </aside>
        </div>
      </div>
    </main>

    <load src="/src/pages/footer.html" />
    <script type="module" src="/src/ts/catalog.ts"></script>
    <script type="module" src="/src/ts/header.ts"></script>
  </body>
</html>
