<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Shop</title>
    <link rel="stylesheet" href="/src/scss/main.scss" />
  </head>
  <header>
    <div class="top-bar">
      <div class="socials">
        <a
          href="https://www.facebook.com"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="src/assets/icons/facebook.svg" alt="Facebook" />
        </a>

        <a
          href="https://www.twitter.com"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="src/assets/icons/twitter.svg" alt="Twitter" />
        </a>

        <a
          href="https://www.instagram.com"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="src/assets/icons/instagram.png" alt="Instagram" />
        </a>
      </div>
      <div class="logo">
        <a href="index.html">
          <img
            src="src/assets/icons/logo-icon.svg"
            alt="Best Shop Logo"
            class="logo-img"
          />
          <span>BEST SHOP</span>
        </a>
      </div>
      <div class="actions">
        <a href="#"
          ><img
            src="src/assets/icons/profile.jpg"
            alt="Profile"
            class="action-icon"
        /></a>
        <a href="#"
          ><img src="src/assets/icons/cart.png" alt="Cart" class="action-icon"
        /></a>
      </div>
    </div>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html" class="active">Catalog</a></li>
        <li><a href="about.html">About us</a></li>
        <li><a href="contact.html">Contact us</a></li>
      </ul>
    </nav>
  </header>
  <main class="catalog-page">
    <div class="container">
      <div class="catalog-toolbar">
        <p class="results-count">Showing 1–12 of 15 Results</p>
        <div class="sorting-wrapper">
          <select class="sort-select">
            <option>Default Sorting</option>
            <option>Price: Low to High</option>
            <option>Price: High to Low</option>
          </select>
        </div>
      </div>

      <div class="catalog-layout">
        <section class="catalog-grid">
          <div class="product-card">...</div>
        </section>

        <aside class="catalog-sidebar">
          <div class="search-widget">
            <input type="text" placeholder="Search Models" />
            <button type="submit"><i class="search-icon"></i></button>
          </div>

          <div class="sidebar-widget">
            <h3>Top Best Sets</h3>
            <ul class="mini-product-list">
              <li>
                <img src="..." alt="mini-product" />
                <div class="mini-info">
                  <h4>Product Title</h4>
                  <div class="rating">★★★★★</div>
                  <span class="price">$1000</span>
                </div>
              </li>
            </ul>
          </div>
        </aside>
      </div>
    </div>
  </main>
  <body>
    <load src="./footer.html" />
  </body>
</html>
