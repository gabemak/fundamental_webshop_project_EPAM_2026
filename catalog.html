<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Shop - Catalog</title>
  </head>
  <body>
    <header>
      <load src="./header.html" />
    </header>

    <main class="catalog-page">
      <div class="container">
        <div class="catalog-header">
          <div class="results-count" id="results-info">
            Showing 1-12 of 20 Results
          </div>

          <div class="catalog-actions">
            <div class="sort-wrapper">
              <select id="sort-select">
                <option value="default">Default Sorting</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="popularity">Popularity (Most popular)</option>
                <option value="rating">Rating (Highest first)</option>
              </select>
            </div>

            <div class="search-wrapper">
              <input
                type="text"
                id="catalog-search"
                placeholder="Search Models"
              />
              <button type="button" class="search-btn">
                <img src="/src/assets/icons/search.svg" alt="Search" />
              </button>
            </div>
          </div>
        </div>

        <div class="catalog-main-content">
          <section class="products-section">
            <div class="product-grid" id="product-grid"></div>
            <div class="pagination" id="pagination"></div>
          </section>

          <aside class="top-sets-sidebar">
            <h3>Top Best Sets</h3>
            <div id="top-sets-container"></div>
          </aside>
        </div>
      </div>
    </main>

    <load src="./footer.html" />
    <script type="module" src="/src/ts/catalog.ts"></script>
  </body>
</html>
