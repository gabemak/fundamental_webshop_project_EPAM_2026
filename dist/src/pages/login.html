<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Log In - Suitcase Pro</title>
    <script type="module" crossorigin src="/assets/login-CzE-Txnh.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/main-YdjzZ70V.js">
    <link rel="stylesheet" crossorigin href="/assets/main-CVRKtbQM.css">
  </head>
  <body class="login-page">
    <div class="login-container">
      <h1 class="login-header">Account Log In</h1>

      <div class="login-card">
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email"
              >Email address <span class="required">*</span></label
            >
            <input type="email" id="email" class="form-control" />
            <div class="error-message" id="emailError">
              Please enter a valid email address.
            </div>
          </div>

          <div class="form-group">
            <label for="password"
              >Password <span class="required">*</span></label
            >
            <div class="password-wrapper">
              <input type="password" id="password" class="form-control" />
              <i
                class="fa-regular fa-eye toggle-password"
                id="togglePassword"
              ></i>
            </div>
            <div class="error-message" id="passwordError">
              Password must be at least 6 characters.
            </div>
          </div>

          <div class="form-options">
            <div class="checkbox-group">
              <input type="checkbox" id="rememberMe" />
              <label for="rememberMe">Remember me</label>
            </div>
            <a href="#" class="forgot-link">Forgot Your Password?</a>
          </div>

          <button type="submit" class="btn-login">Log In</button>
        </form>
      </div>
    </div>
  </body>
</html>
